<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Kurumsal Asistan</title>
    <style>
        /* Modern iPhone Arayüz Tasarımı */
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone {
            width: 320px;
            height: 650px;
            background: linear-gradient(180deg, #2c3e50 0%, #000000 100%);
            border-radius: 40px;
            border: 10px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 20px;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.1);
        }

        /* Üst Kısım: Arayan Bilgisi */
        .caller-info {
            text-align: center;
            margin-top: 40px;
        }

        .caller-photo {
            width: 100px;
            height: 100px;
            background: #e0e0e0;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .caller-info h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .caller-info p {
            color: #8e8e93;
            margin-top: 8px;
            font-size: 16px;
        }

        /* Süre ve Durum */
        #timer {
            font-size: 20px;
            color: white;
            margin-top: 10px;
            font-weight: 300;
            opacity: 0;
        }

        #statusText {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 20px;
            height: 20px;
            transition: color 0.3s;
        }

        /* Kontroller */
        .controls-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 50px;
            width: 100%;
        }

        .btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.95); }

        .btn-call { background-color: #30d158; } /* Yeşil */
        .btn-end { background-color: #ff453a; }   /* Kırmızı */

        /* Bas Konuş Butonu (Büyük Mavi) */
        .btn-talk {
            background-color: #0a84ff;
            width: 100%;
            height: 60px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            display: none; /* Başta gizli */
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }

        /* Animasyonlar */
        .talking { animation: pulse-blue 1.5s infinite; background-color: #5ac8fa !important; }
        
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(90, 200, 250, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(90, 200, 250, 0); }
            100% { box-shadow: 0 0 0 0 rgba(90, 200, 250, 0); }
        }

    </style>
</head>
<body>

    <div class="phone">
        <div class="caller-info">
            <div class="caller-photo">🏢</div>
            <h1>TechFix Asistan</h1>
            <p>Kurumsal Hat</p>
            <div id="timer">00:00</div>
        </div>

        <div class="controls-area">
            <div id="statusText">Aramaya Hazır</div>

            <button id="talkBtn" class="btn btn-talk">🎙️ Basılı Tut ve Konuş</button>

            <div class="action-buttons">
                <button id="callBtn" class="btn btn-call" onclick="startCall()">📞</button>
                <button id="hangBtn" class="btn btn-end" onclick="endCall()" style="opacity: 0.5; pointer-events: none;">❌</button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isCalling = false;
        let startTime;
        let timerInterval;

        // Elementleri Seç
        const statusText = document.getElementById("statusText");
        const talkBtn = document.getElementById("talkBtn");
        const callBtn = document.getElementById("callBtn");
        const hangBtn = document.getElementById("hangBtn");
        const timerDisplay = document.getElementById("timer");

        // --- 1. Aramayı Başlat ---
        async function startCall() {
            try {
                // Tarayıcıdan mikrofon izni iste
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                isCalling = true;
                
                // UI Değişiklikleri (Arama başladı)
                callBtn.style.display = 'none'; // Yeşil tuş gider
                hangBtn.style.opacity = '1';
                hangBtn.style.pointerEvents = 'all'; // Kırmızı tuş aktif
                talkBtn.style.display = 'block'; // Bas konuş gelir
                timerDisplay.style.opacity = '1';
                statusText.innerText = "Bağlandı.";
                
                // Süre sayacı başlat
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);

                // Kaydediciyi ayarla
                setupRecorder();

            } catch (err) {
                alert("Mikrofon izni vermeniz gerekiyor!");
                console.error(err);
            }
        }

        // --- 2. Bas-Konuş Mantığı ---
        function setupRecorder() {
            // Butona basınca kayıt başlar
            talkBtn.onmousedown = (e) => {
                e.preventDefault(); // Mobilde seçimi engelle
                audioChunks = [];
                mediaRecorder.start();
                talkBtn.classList.add("talking");
                talkBtn.innerText = "Dinliyor...";
                statusText.innerText = "Siz konuşuyorsunuz...";
                statusText.style.color = "#5ac8fa";
            };

            // Butonu bırakınca kayıt biter ve gönderilir
            talkBtn.onmouseup = () => {
                mediaRecorder.stop();
                talkBtn.classList.remove("talking");
                talkBtn.innerText = "🎙️ Basılı Tut ve Konuş";
                statusText.innerText = "Aslı düşünüyor...";
                statusText.style.color = "#8e8e93";
            };

            // Ses verisi hazır olduğunda
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            // Kayıt tamamen durduğunda sunucuya gönder
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append("file", audioBlob);

                try {
                    // Python Backend'e POST at
                    const response = await fetch("http://localhost:8000/talk", {
                        method: "POST",
                        body: formData
                    });

                    if (!response.ok) throw new Error("Sunucu hatası");

                    // Gelen ses dosyasını çal (Blob olarak)
                    const audioBlobResponse = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlobResponse);
                    const audio = new Audio(audioUrl);
                    
                    statusText.innerText = "Aslı konuşuyor...";
                    statusText.style.color = "#30d158";
                    
                    audio.play();

                    audio.onended = () => {
                        statusText.innerText = "Sıra sizde...";
                        statusText.style.color = "#8e8e93";
                    };

                } catch (error) {
                    console.error("Hata:", error);
                    statusText.innerText = "Hata oluştu!";
                }
            };
        }

        // --- 3. Aramayı Bitir ve Notları Kaydet ---
        async function endCall() {
            clearInterval(timerInterval);
            statusText.innerText = "Görüşme notları kaydediliyor...";
            
            try {
                // Backend'e "Bitir" sinyali gönder
                await fetch("http://localhost:8000/end-call", { method: "POST" });
                
                setTimeout(() => {
                    alert("Görüşme Sonlandı. Notlar 'GORUSME_NOTLARI.txt' dosyasına kaydedildi.");
                    location.reload(); // Sayfayı yenile
                }, 1000);
            } catch (e) {
                alert("Sunucuya ulaşılamadı.");
                location.reload();
            }
        }

        // --- Yardımcı: Süre Sayacı ---
        function updateTimer() {
            let delta = Date.now() - startTime;
            let sec = Math.floor(delta / 1000) % 60;
            let min = Math.floor(delta / 60000);
            timerDisplay.innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
        }
    </script>
</body>
</html>
